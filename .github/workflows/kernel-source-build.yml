name: 自定义源码内核构建流程

permissions:
  contents: write
  actions: write

on:
  workflow_call:
    inputs:
      kernel_repo:
        required: true
        type: string
      kernel_branch:
        required: true
        type: string
      kmi:
        required: true
        type: string
      clang_version:
        required: false
        type: string
        default: ""
      clang_branch:
        required: false
        type: string
        default: "master-kernel-build-2022"
      localversion:
        required: false
        type: string
        default: ""
      extra_config_fragment:
        required: false
        type: string
        default: ""
      ksu_variant:
        required: true
        type: string
      enable_susfs:
        required: false
        type: boolean
        default: false
      use_kpm:
        required: false
        type: boolean
        default: false
      use_lz4kd:
        required: false
        type: boolean
        default: false
      use_bbg:
        required: false
        type: boolean
        default: true

jobs:
  build:
    name: "${{ inputs.kmi }}-${{ inputs.ksu_variant }}"
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      KERNEL_REPO: ${{ inputs.kernel_repo }}
      KERNEL_BRANCH: ${{ inputs.kernel_branch }}
      KMI: ${{ inputs.kmi }}
      CLANG_VERSION_INPUT: ${{ inputs.clang_version }}
      CLANG_BRANCH: ${{ inputs.clang_branch }}
      LOCALVERSION: ${{ inputs.localversion }}
      EXTRA_CONFIG_FRAGMENT: ${{ inputs.extra_config_fragment }}
      KSU_VARIANT: ${{ inputs.ksu_variant }}
      ENABLE_SUSFS: ${{ inputs.enable_susfs }}
      USE_KPM: ${{ inputs.use_kpm }}
      USE_LZ4KD: ${{ inputs.use_lz4kd }}
      USE_BBG: ${{ inputs.use_bbg }}
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      CCACHE_MAXSIZE: 8G

    steps:
      - name: 检出 ABK 补丁仓库
        uses: actions/checkout@v6

      - name: 解析 KMI 与构建信息摘要
        shell: bash
        run: |
          set -euo pipefail

          case "$KMI" in
            android12-5.10|android13-5.15|android14-6.1|android15-6.6|android16-6.12) ;;
            *)
              echo "::error::不支持的 KMI: $KMI（应为 androidXX-<kernel> 形式）"
              exit 1
              ;;
          esac
          ANDROID_VERSION="${KMI%%-*}"
          KERNEL_VERSION="${KMI##*-}"

          effective_kpm="$USE_KPM"
          if [ "$KSU_VARIANT" != "SukiSU" ] && [ "$KSU_VARIANT" != "ReSukiSU" ]; then
            effective_kpm="false"
          fi

          effective_susfs="$ENABLE_SUSFS"
          if [ "$KSU_VARIANT" = "None" ]; then
            effective_susfs="false"
          fi

          effective_lz4kd="$USE_LZ4KD"
          case "$KERNEL_VERSION" in
            5.10|5.15|6.1|6.6) ;;
            *)
              if [ "$effective_lz4kd" = "true" ]; then
                echo "::warning::当前内核版本不在 lz4kd 支持矩阵内，已关闭 lz4kd。"
              fi
              effective_lz4kd="false"
              ;;
          esac

          {
            echo "ANDROID_VERSION=$ANDROID_VERSION"
            echo "KERNEL_VERSION=$KERNEL_VERSION"
            echo "EFFECTIVE_KPM=$effective_kpm"
            echo "EFFECTIVE_ENABLE_SUSFS=$effective_susfs"
            echo "EFFECTIVE_USE_LZ4KD=$effective_lz4kd"
          } >> "$GITHUB_ENV"

          echo "========================================"
          echo "       自定义源码内核构建配置摘要"
          echo "========================================"
          echo "构建目标      : 自定义内核源码"
          echo "内核仓库      : $KERNEL_REPO"
          echo "内核分支      : $KERNEL_BRANCH"
          echo "KMI 组合      : $KMI"
          echo "Android 版本  : $ANDROID_VERSION"
          echo "内核版本      : $KERNEL_VERSION"
          echo "本地版本号    : ${LOCALVERSION:-（沿用源码）}"
          echo "额外配置片段  : ${EXTRA_CONFIG_FRAGMENT:-无}"
          echo "KSU 变体      : $KSU_VARIANT"
          echo "SUSFS 状态    : $effective_susfs"
          echo "KPM 功能      : $effective_kpm"
          echo "ZRAM lz4kd    : $effective_lz4kd"
          echo "BBG 补丁      : $USE_BBG"
          echo "========================================"

      - name: 校验输入
        shell: bash
        run: |
          set -euo pipefail
          case "$KERNEL_REPO" in
            http://*|https://*|git://*|ssh://*|git@*) ;;
            *) echo "::error::不支持的内核仓库链接: $KERNEL_REPO"; exit 1 ;;
          esac
          if [ "$USE_KPM" = "true" ] && [ "$KSU_VARIANT" != "SukiSU" ] && [ "$KSU_VARIANT" != "ReSukiSU" ]; then
            echo "::error::Official / None 变体不支持 KPM，请关闭 KPM 后重试。"
            exit 1
          fi

      - name: 最大化构建空间
        if: ${{ inputs.kmi == 'android12-5.10' || inputs.kmi == 'android13-5.15' }}
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 4096
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"

      - name: 安装依赖
        shell: bash
        run: |
          set -euo pipefail
          apt_update_retry() {
            local attempt
            for attempt in 1 2 3; do
              if sudo apt-get update; then
                return 0
              fi
              echo "::warning::apt-get update 第 ${attempt} 次失败，清理索引后重试。"
              sudo apt-get clean || true
              sudo rm -rf /var/lib/apt/lists/*
              sleep "$attempt"
            done
            echo "::error::apt-get update 连续失败。"
            return 1
          }

          apt_update_retry
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -yq --no-install-recommends \
            python3 git curl ccache libelf-dev build-essential flex bison libssl-dev \
            libncurses-dev liblz4-tool zlib1g-dev libxml2-utils rsync unzip gawk \
            dos2unix zip dwarves gcc-aarch64-linux-gnu

      - name: 配置 ccache
        shell: bash
        run: |
          set -euo pipefail
          CCACHE_DIR="$HOME/.ccache_source_${KSU_VARIANT}"
          echo "CCACHE_DIR=$CCACHE_DIR" >> "$GITHUB_ENV"
          mkdir -p "$CCACHE_DIR"
          ccache -M "$CCACHE_MAXSIZE"
          ccache -z

      - name: 恢复 ccache
        uses: actions/cache@v5
        with:
          path: ~/.ccache_source_${{ inputs.ksu_variant }}
          key: source-ccache-${{ runner.os }}-${{ inputs.kmi }}-${{ inputs.ksu_variant }}
          restore-keys: |
            source-ccache-${{ runner.os }}-${{ inputs.kmi }}-
            source-ccache-${{ runner.os }}-

      - name: 克隆自定义内核源码
        shell: bash
        run: |
          set -euo pipefail
          git config --global user.name "abk-builder"
          git config --global user.email "abk-builder@users.noreply.github.com"

          WORKSPACE="$GITHUB_WORKSPACE/source_workspace"
          KERNEL_ROOT="$WORKSPACE/kernel_workspace/kernel_platform"
          COMMON_ROOT="$KERNEL_ROOT/common"
          rm -rf "$WORKSPACE"
          mkdir -p "$KERNEL_ROOT"

          git clone --depth=1 -b "$KERNEL_BRANCH" "$KERNEL_REPO" "$COMMON_ROOT"

          if [ ! -f "$COMMON_ROOT/Makefile" ] || [ ! -f "$COMMON_ROOT/arch/arm64/configs/gki_defconfig" ]; then
            echo "::error::克隆的仓库不是可识别的 GKI 内核树（缺少 Makefile 或 arch/arm64/configs/gki_defconfig）。"
            exit 1
          fi

          rm -f "$COMMON_ROOT"/android/abi_gki_protected_exports_* || true
          for script in \
            "$COMMON_ROOT/scripts/setlocalversion" \
            "$COMMON_ROOT/external/dtc/scripts/setlocalversion"; do
            [ -f "$script" ] || continue
            sed -i 's/ -dirty//g' "$script"
          done

          MK_VERSION="$(awk -F' = ' '/^VERSION = /{print $2}' "$COMMON_ROOT/Makefile")"
          MK_PATCHLEVEL="$(awk -F' = ' '/^PATCHLEVEL = /{print $2}' "$COMMON_ROOT/Makefile")"
          MK_SUBLEVEL="$(awk -F' = ' '/^SUBLEVEL = /{print $2}' "$COMMON_ROOT/Makefile")"
          KERNEL_RELEASE_BASE="${MK_VERSION}.${MK_PATCHLEVEL}.${MK_SUBLEVEL}"
          echo "源码内核版本: $KERNEL_RELEASE_BASE"

          {
            echo "SOURCE_WORKSPACE=$WORKSPACE"
            echo "SOURCE_KERNEL_ROOT=$KERNEL_ROOT"
            echo "SOURCE_COMMON_ROOT=$COMMON_ROOT"
            echo "KERNEL_RELEASE_BASE=$KERNEL_RELEASE_BASE"
          } >> "$GITHUB_ENV"

      - name: 解析并下载 Clang 工具链
        shell: bash
        run: |
          set -euo pipefail
          COMMON_ROOT="$SOURCE_COMMON_ROOT"

          clang_version="$CLANG_VERSION_INPUT"
          if [ -z "$clang_version" ] && [ -f "$COMMON_ROOT/build.config.constants" ]; then
            clang_version="$(awk -F= '/^CLANG_VERSION=/{print $2}' "$COMMON_ROOT/build.config.constants" | tr -d '[:space:]')"
          fi
          if [ -z "$clang_version" ]; then
            case "$KERNEL_VERSION" in
              5.10) clang_version="r416183b" ;;
              5.15) clang_version="r450784e" ;;
              6.1)  clang_version="r487747c" ;;
              6.6)  clang_version="r510928"  ;;
              *)    clang_version="r450784e" ;;
            esac
          fi
          echo "使用 Clang 版本: $clang_version（分支 $CLANG_BRANCH）"

          CLANG_DIR="$GITHUB_WORKSPACE/clang-prebuilt"
          rm -rf "$CLANG_DIR"
          git clone --depth=1 -b "$CLANG_BRANCH" \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 "$CLANG_DIR"

          CLANG_BIN="$CLANG_DIR/clang-${clang_version}/bin"
          if [ ! -x "$CLANG_BIN/clang" ]; then
            echo "::error::未在 $CLANG_BRANCH 分支中找到 clang-${clang_version}。可用版本："
            ls "$CLANG_DIR" | grep '^clang-' || true
            exit 1
          fi
          "$CLANG_BIN/clang" --version | head -n 1

          echo "CLANG_BIN=$CLANG_BIN" >> "$GITHUB_ENV"

      - name: 准备 KernelSU 和补丁
        shell: bash
        run: |
          set -euo pipefail
          WORKSPACE="$SOURCE_WORKSPACE"
          KERNEL_ROOT="$SOURCE_KERNEL_ROOT"
          COMMON_ROOT="$SOURCE_COMMON_ROOT"

          if [ "$KSU_VARIANT" != "None" ]; then
            cd "$KERNEL_ROOT"
            case "$KSU_VARIANT" in
              Official)
                curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/refs/heads/main/kernel/setup.sh" | bash -s main
                ;;
              SukiSU)
                curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/builtin/kernel/setup.sh" | bash -s builtin
                ;;
              ReSukiSU)
                curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash -s main
                ;;
              *)
                echo "::error::未知 KSU 变体: $KSU_VARIANT"
                exit 1
                ;;
            esac
          fi

          cd "$WORKSPACE"
          rm -rf kernel_patches SukiSU_patch susfs4ksu
          git clone https://github.com/Xiaomichael/kernel_patches.git --depth=1
          git clone https://github.com/ShirkNeko/SukiSU_patch.git --depth=1
          if [ "$EFFECTIVE_ENABLE_SUSFS" = "true" ]; then
            git clone https://gitlab.com/simonpunk/susfs4ksu.git \
              -b "gki-${ANDROID_VERSION}-${KERNEL_VERSION}" \
              --depth=1
          fi

          if [ "$USE_BBG" = "true" ] && [ "$EFFECTIVE_KPM" = "false" ]; then
            cd "$COMMON_ROOT"
            curl -fsSL https://github.com/vc-teahouse/Baseband-guard/raw/main/setup.sh -o setup-bbg.sh
            bash setup-bbg.sh
          fi

          cp "$WORKSPACE/kernel_patches/zram_patches/001-lz4.patch" "$COMMON_ROOT/"
          cp "$WORKSPACE/kernel_patches/zram_patches/lz4armv8.S" "$COMMON_ROOT/lib/"
          cp "$WORKSPACE/kernel_patches/zram_patches/002-zstd.patch" "$COMMON_ROOT/"

          cd "$KERNEL_ROOT"
          if [ "$EFFECTIVE_USE_LZ4KD" = "true" ]; then
            cp -r "$WORKSPACE"/SukiSU_patch/other/zram/lz4k/include/linux/* "$COMMON_ROOT/include/linux/" || true
            cp -r "$WORKSPACE"/SukiSU_patch/other/zram/lz4k/lib/* "$COMMON_ROOT/lib/" || true
            cp -r "$WORKSPACE"/SukiSU_patch/other/zram/lz4k/crypto/* "$COMMON_ROOT/crypto/" || true
            cp -r "$WORKSPACE"/SukiSU_patch/other/zram/lz4k_oplus "$COMMON_ROOT/lib/" || true
            cp "$WORKSPACE/SukiSU_patch/other/zram/zram_patch/${KERNEL_VERSION}/lz4kd.patch" "$COMMON_ROOT/" || true
            cp "$WORKSPACE/SukiSU_patch/other/zram/zram_patch/${KERNEL_VERSION}/lz4k_oplus.patch" "$COMMON_ROOT/" || true
          fi

          if [ "$EFFECTIVE_ENABLE_SUSFS" = "true" ]; then
            cp "$WORKSPACE/susfs4ksu/kernel_patches/50_add_susfs_in_gki-${ANDROID_VERSION}-${KERNEL_VERSION}.patch" "$COMMON_ROOT/" || true
            cp "$WORKSPACE"/susfs4ksu/kernel_patches/fs/* "$COMMON_ROOT/fs/" || true
            cp "$WORKSPACE"/susfs4ksu/kernel_patches/include/linux/* "$COMMON_ROOT/include/linux/" || true
          elif [ "$KSU_VARIANT" = "SukiSU" ] || [ "$KSU_VARIANT" = "ReSukiSU" ]; then
            MANUAL_HOOK_PATCH=""
            case "$KERNEL_VERSION" in
              5.10|5.15)
                MANUAL_HOOK_PATCH="$WORKSPACE/kernel_patches/sukisu/scope_min_manual_hooks_v1.6.patch"
                ;;
              *)
                if [ -f "$WORKSPACE/kernel_patches/sukisu/scope_min_manual_hooks_v1.9.patch" ]; then
                  MANUAL_HOOK_PATCH="$WORKSPACE/kernel_patches/sukisu/scope_min_manual_hooks_v1.9.patch"
                else
                  MANUAL_HOOK_PATCH="$WORKSPACE/kernel_patches/sukisu/scope_min_manual_hooks_v1.6.patch"
                fi
                ;;
            esac
            [ -n "$MANUAL_HOOK_PATCH" ] && cp "$MANUAL_HOOK_PATCH" "$COMMON_ROOT/" || true
          fi

          cd "$COMMON_ROOT"
          for patch_file in scope_min_manual_hooks_v1.9.patch scope_min_manual_hooks_v1.6.patch; do
            [ -f "$patch_file" ] && patch -p1 < "$patch_file" || true
          done
          if [ "$EFFECTIVE_USE_LZ4KD" = "true" ]; then
            [ -f lz4kd.patch ] && patch -p1 < lz4kd.patch || true
            [ -f lz4k_oplus.patch ] && patch -p1 < lz4k_oplus.patch || true
          elif [ "$KERNEL_VERSION" = "6.1" ]; then
            [ -f 001-lz4.patch ] && git apply -p1 < 001-lz4.patch || true
            [ -f 002-zstd.patch ] && patch -p1 < 002-zstd.patch || true
          elif [ "$KERNEL_VERSION" = "6.6" ]; then
            [ -f 001-lz4.patch ] && git apply -p1 < 001-lz4.patch || true
          fi
          if [ "$EFFECTIVE_ENABLE_SUSFS" = "true" ]; then
            [ -f "50_add_susfs_in_gki-${ANDROID_VERSION}-${KERNEL_VERSION}.patch" ] && \
              patch -p1 < "50_add_susfs_in_gki-${ANDROID_VERSION}-${KERNEL_VERSION}.patch" || true
          fi

      - name: 修复 SukiSU SUSFS 源码兼容
        if: ${{ inputs.ksu_variant == 'SukiSU' && inputs.enable_susfs }}
        shell: bash
        run: |
          set -euo pipefail
          KERNEL_ROOT="$SOURCE_KERNEL_ROOT"

          KSU_BUILD_DIR=""
          for dir in common/drivers/kernelsu drivers/kernelsu KernelSU/kernel kernel; do
            if [ -d "$KERNEL_ROOT/$dir" ]; then
              KSU_BUILD_DIR="$KERNEL_ROOT/$dir"
              break
            fi
          done

          if [ -z "$KSU_BUILD_DIR" ]; then
            echo "::error::未找到 SukiSU 源码目录，无法修复 SUSFS 兼容。"
            exit 1
          fi

          python3 - "$KSU_BUILD_DIR" <<'PY'
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          selinux_hide = root / "feature" / "selinux_hide.c"
          rules_c = root / "selinux" / "rules.c"

          if selinux_hide.exists():
              path = selinux_hide
              text = path.read_text()
              original = text
              replacements = [
                  ("static struct selinux_state fake_state;", "struct selinux_state fake_state;"),
                  (
                      "static bool ksu_selinux_hide_running __read_mostly = false;",
                      "bool ksu_selinux_hide_running __read_mostly = false;",
                  ),
                  ("static int security_context_to_sid_with_policy(", "int security_context_to_sid_with_policy("),
                  ("static int security_sid_to_context_with_policy(", "int security_sid_to_context_with_policy("),
                  (
                      "static void __nocfi security_compute_av_user_with_policy(",
                      "void __nocfi security_compute_av_user_with_policy(",
                  ),
                  ("static void security_compute_av_user_with_policy(", "void security_compute_av_user_with_policy("),
                  ("static struct selinux_policy *backup_sepolicy;", "struct selinux_policy *backup_sepolicy;"),
              ]
              for old, new in replacements:
                  text = text.replace(old, new)

              if text != original:
                  path.write_text(text)
                  print(f"patched {path}")
              else:
                  print(f"no change for {path}")

              final_text = path.read_text()
              forbidden = (
                  "static struct selinux_state fake_state;",
                  "static bool ksu_selinux_hide_running __read_mostly = false;",
                  "static int security_context_to_sid_with_policy(",
                  "static int security_sid_to_context_with_policy(",
                  "static void __nocfi security_compute_av_user_with_policy(",
                  "static void security_compute_av_user_with_policy(",
              )
              present = [marker for marker in forbidden if marker in final_text]
              if present:
                  raise SystemExit(f"{path} still contains non-exported SELinux compatibility symbols: {present}")
          elif rules_c.exists():
              path = rules_c
              text = path.read_text()
              original = text
              marker = "/* ABK: OnePlus builtin SUSFS SELinux compatibility globals. */"
              if marker not in text:
                  block = "\n".join([
                      "",
                      marker,
                      "#ifdef CONFIG_KSU_SUSFS",
                      "struct selinux_policy *backup_sepolicy;",
                      "#if LINUX_VERSION_CODE >= KERNEL_VERSION(6, 6, 0)",
                      "int security_context_to_sid_with_policy(struct selinux_policy *policy, const char *scontext, u32 scontext_len,",
                      "                                        u32 *sid, u32 def_sid, unsigned int gfp_flags)",
                      "{",
                      "    return -22;",
                      "}",
                      "int security_sid_to_context_with_policy(struct selinux_policy *policy, u32 sid, char **scontext,",
                      "                                        u32 *scontext_len)",
                      "{",
                      "    return -22;",
                      "}",
                      "void security_compute_av_user_with_policy(struct selinux_policy *policy, u32 ssid, u32 tsid, u16 tclass,",
                      "                                          struct av_decision *avd)",
                      "{",
                      "}",
                      "#endif",
                      "#endif",
                      "",
                  ])
                  anchor = "#define ALL NULL\n"
                  if anchor not in text:
                      raise SystemExit(f"{path} missing insertion anchor: {anchor.strip()}")
                  text = text.replace(anchor, anchor + block, 1)

              if text != original:
                  path.write_text(text)
                  print(f"patched {path}")
              else:
                  print(f"no change for {path}")

              final_text = path.read_text()
              required = (
                  "struct selinux_policy *backup_sepolicy;",
                  "int security_context_to_sid_with_policy(",
                  "int security_sid_to_context_with_policy(",
                  "void security_compute_av_user_with_policy(",
              )
              missing = [marker for marker in required if marker not in final_text]
              if missing:
                  raise SystemExit(f"{path} missing OnePlus builtin SELinux compatibility markers: {missing}")
          else:
              raise SystemExit(f"{root} does not contain a supported SELinux compatibility source file")
          PY

      - name: 修复 SukiSU/ReSukiSU sulog 兼容
        if: ${{ inputs.ksu_variant == 'SukiSU' || inputs.ksu_variant == 'ReSukiSU' }}
        shell: bash
        run: |
          set -euo pipefail
          KERNEL_ROOT="$SOURCE_KERNEL_ROOT"

          KSU_BUILD_DIR=""
          for dir in common/drivers/kernelsu drivers/kernelsu KernelSU/kernel; do
            if [ -d "$KERNEL_ROOT/$dir" ]; then
              KSU_BUILD_DIR="$KERNEL_ROOT/$dir"
              break
            fi
          done

          if [ -z "$KSU_BUILD_DIR" ]; then
            echo "::warning::未找到 SukiSU/ReSukiSU 编译目录，跳过 sulog 兼容修复。"
            exit 0
          fi

          python3 - "$KSU_BUILD_DIR/sulog/event.c" <<'PY'
          import sys
          from pathlib import Path
          import re

          path = Path(sys.argv[1])
          if not path.exists():
              raise SystemExit(0)

          text = path.read_text()
          marker = "builtin SUSFS ksu_sulog_capture() expects argv_user as a pointer"
          new = "\n".join([
              "    /* ABK: builtin SUSFS ksu_sulog_capture() expects argv_user as a pointer. */",
              "#ifdef CONFIG_KSU_SUSFS",
              "    pending = ksu_sulog_capture(KSU_SULOG_EVENT_IOCTL_GRANT_ROOT, NULL, NULL, gfp);",
              "#else",
              "    pending = ksu_sulog_capture(KSU_SULOG_EVENT_IOCTL_GRANT_ROOT, NULL, USER_ARG_NULL, gfp);",
              "#endif",
          ])

          changed = False
          if marker not in text:
              for old in (
                  "    pending = ksu_sulog_capture(KSU_SULOG_EVENT_IOCTL_GRANT_ROOT, NULL, USER_ARG_NULL, gfp);",
                  "    pending = ksu_sulog_capture(KSU_SULOG_EVENT_IOCTL_GRANT_ROOT, NULL, &USER_ARG_NULL, gfp);",
              ):
                  if old in text:
                      text = text.replace(old, new, 1)
                      changed = True
                      break

          if changed:
              path.write_text(text)
              print(f"patched {path}")
          else:
              print(f"no change for {path}")

          final_text = path.read_text()
          incompatible = re.search(
              r"pending = ksu_sulog_capture\(KSU_SULOG_EVENT_IOCTL_GRANT_ROOT, NULL, &?USER_ARG_NULL, gfp\);",
              final_text,
          )
          if incompatible and marker not in final_text:
              raise SystemExit(f"{path} still contains incompatible ksu_sulog_capture grant_root argv call")
          PY

      - name: 注入 SukiSU/ReSukiSU KPM Kconfig
        if: ${{ inputs.use_kpm && (inputs.ksu_variant == 'SukiSU' || inputs.ksu_variant == 'ReSukiSU') }}
        shell: bash
        run: |
          set -euo pipefail
          KERNEL_ROOT="$SOURCE_KERNEL_ROOT"

          KSU_KERNEL_DIR=""
          for dir in common/drivers/kernelsu drivers/kernelsu KernelSU/kernel kernel; do
            if [ -f "$KERNEL_ROOT/$dir/Kconfig" ]; then
              KSU_KERNEL_DIR="$KERNEL_ROOT/$dir"
              break
            fi
          done

          if [ -z "$KSU_KERNEL_DIR" ]; then
            echo "::error::未找到 $KSU_VARIANT Kconfig，无法注入 KPM Kconfig 符号。"
            exit 1
          fi

          {
            echo "ABK_KPM_KCONFIG_DIR=$KSU_KERNEL_DIR"
            echo "ABK_KPM_KCONFIG_PATH=$KSU_KERNEL_DIR/Kconfig"
          } >> "$GITHUB_ENV"

          python3 - "$KSU_KERNEL_DIR/Kconfig" "$GITHUB_ENV" <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path(sys.argv[1])
          github_env = Path(sys.argv[2])
          text = path.read_text()
          pattern = re.compile(r"(?m)^[ \t]*config[ \t]+KPM\b")
          if pattern.search(text):
              with github_env.open("a", encoding="utf-8") as handle:
                  handle.write("ABK_KPM_KCONFIG_STATUS=native\n")
                  handle.write("ABK_KPM_KCONFIG_READY=true\n")
              print(f"{path} 已包含 KPM Kconfig 符号")
              raise SystemExit(0)

          lines = [
              "",
              'menu "KernelSU - KPM"',
              "config KPM",
              '  bool "KernelPatch Module support"',
              "  depends on KSU",
              "  default y",
              "",
              "endmenu",
          ]
          block = "\n".join(lines)

          marker = "\nendmenu\n"
          if marker in text:
              text = text.rsplit(marker, 1)[0].rstrip() + "\n" + block + marker
          else:
              text = text.rstrip() + "\n" + block + "\n"
          path.write_text(text)

          final_text = path.read_text()
          if not pattern.search(final_text):
              raise SystemExit(f"{path} 注入后仍缺少 config KPM")

          with github_env.open("a", encoding="utf-8") as handle:
              handle.write("ABK_KPM_KCONFIG_STATUS=injected\n")
              handle.write("ABK_KPM_KCONFIG_READY=true\n")
          print(f"已注入 {path} 的 KPM Kconfig 符号")
          PY

      - name: 配置 defconfig
        shell: bash
        run: |
          set -euo pipefail
          KERNEL_ROOT="$SOURCE_KERNEL_ROOT"
          COMMON_ROOT="$SOURCE_COMMON_ROOT"
          DEFCONFIG_PATH="$COMMON_ROOT/arch/arm64/configs/gki_defconfig"
          kpm_kconfig_status="${ABK_KPM_KCONFIG_STATUS:-unknown}"
          kpm_kconfig_ready="${ABK_KPM_KCONFIG_READY:-false}"
          kpm_kconfig_path="${ABK_KPM_KCONFIG_PATH:-}"
          test -f "$DEFCONFIG_PATH"

          if [ -n "$EXTRA_CONFIG_FRAGMENT" ]; then
            IFS=',' read -r -a fragments <<< "$EXTRA_CONFIG_FRAGMENT"
            for fragment in "${fragments[@]}"; do
              fragment="$(echo "$fragment" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"
              [ -n "$fragment" ] || continue
              frag_path="$COMMON_ROOT/arch/arm64/configs/$fragment"
              if [ -f "$frag_path" ]; then
                echo "合并额外配置片段: $fragment"
                echo "" >> "$DEFCONFIG_PATH"
                cat "$frag_path" >> "$DEFCONFIG_PATH"
              else
                echo "::warning::未找到额外配置片段: $fragment（跳过）"
              fi
            done
          fi

          if [ "$KSU_VARIANT" != "None" ]; then
            if [ "$EFFECTIVE_ENABLE_SUSFS" = "true" ]; then
              cat >> "$DEFCONFIG_PATH" <<'EOF'
          CONFIG_KSU=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SUS_OVERLAYFS=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          EOF
            else
              cat >> "$DEFCONFIG_PATH" <<'EOF'
          CONFIG_KSU=y
          CONFIG_KSU_SUSFS=n
          CONFIG_KSU_MANUAL_HOOK=y
          EOF
            fi
          fi

          cat >> "$DEFCONFIG_PATH" <<'EOF'
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_HEADERS_INSTALL=n
          EOF

          kpm_config_supported="false"
          if [ "$KSU_VARIANT" = "SukiSU" ] || [ "$KSU_VARIANT" = "ReSukiSU" ]; then
            if [ "$kpm_kconfig_ready" = "true" ] && [ -f "$kpm_kconfig_path" ]; then
              kpm_config_supported="true"
            else
              for dir in KernelSU/kernel common/drivers/kernelsu drivers/kernelsu kernel; do
                if [ -f "$KERNEL_ROOT/$dir/Kconfig" ] && grep -Eq '^[[:space:]]*config[[:space:]]+KPM\b' "$KERNEL_ROOT/$dir/Kconfig"; then
                  kpm_config_supported="true"
                  break
                fi
              done
            fi
          fi

          if [ "$EFFECTIVE_KPM" = "true" ] && [ "$kpm_config_supported" = "true" ]; then
            echo "CONFIG_KPM=y" >> "$DEFCONFIG_PATH"
            echo "已启用 CONFIG_KPM（$kpm_kconfig_status）。"
          elif [ "$EFFECTIVE_KPM" = "true" ]; then
            echo "::error::请求启用 KPM，但当前 $KSU_VARIANT 源码树仍未提供 config KPM。"
            exit 1
          elif [ "$KSU_VARIANT" = "SukiSU" ] || [ "$KSU_VARIANT" = "ReSukiSU" ]; then
            if [ "$kpm_config_supported" = "true" ]; then
              echo "# CONFIG_KPM is not set" >> "$DEFCONFIG_PATH"
            fi
          fi

          if [ "$USE_BBG" = "true" ] && [ "$EFFECTIVE_KPM" = "false" ]; then
              cat >> "$DEFCONFIG_PATH" <<'EOF'
          CONFIG_BBG=y
          CONFIG_LSM="landlock,lockdown,yama,loadpin,safesetid,integrity,selinux,smack,tomoyo,apparmor,bpf,baseband_guard"
          EOF
          fi

          if [ "$EFFECTIVE_USE_LZ4KD" = "true" ]; then
              cat >> "$DEFCONFIG_PATH" <<'EOF'
          CONFIG_CRYPTO_LZ4KD=y
          CONFIG_CRYPTO_LZ4K_OPLUS=y
          CONFIG_ZRAM_WRITEBACK=y
          EOF
          fi

          if [ "$KERNEL_VERSION" = "6.1" ] || [ "$KERNEL_VERSION" = "6.6" ]; then
            echo "CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y" >> "$DEFCONFIG_PATH"
          fi

          if [ "$KERNEL_VERSION" = "5.10" ] || [ "$KERNEL_VERSION" = "5.15" ]; then
            sed -i 's/^CONFIG_LTO=n/CONFIG_LTO=y/' "$DEFCONFIG_PATH" || true
            sed -i 's/^CONFIG_LTO_CLANG_FULL=y/CONFIG_LTO_CLANG_THIN=y/' "$DEFCONFIG_PATH" || true
            sed -i 's/^CONFIG_LTO_CLANG_NONE=y/CONFIG_LTO_CLANG_THIN=y/' "$DEFCONFIG_PATH" || true
            grep -q '^CONFIG_LTO_CLANG_THIN=y' "$DEFCONFIG_PATH" || echo 'CONFIG_LTO_CLANG_THIN=y' >> "$DEFCONFIG_PATH"
          fi
          sed -i 's/check_defconfig//' "$COMMON_ROOT/build.config.gki" || true

      - name: 配置内核名称
        if: ${{ inputs.localversion != '' }}
        shell: bash
        run: |
          set -euo pipefail
          COMMON_ROOT="$SOURCE_COMMON_ROOT"
          cd "$COMMON_ROOT"

          SUFFIX="-${LOCALVERSION}"
          echo "设置内核 localversion 后缀: $SUFFIX"

          sed -i 's/ -dirty//g' scripts/setlocalversion || true
          perl -i -0777 -pe 's/(.*)echo "\$\{KERNELVERSION\}\$\{file_localversion\}\$\{config_localversion\}\$\{LOCALVERSION\}\$\{scm_version\}"/$1echo "\$\{KERNELVERSION\}'"${SUFFIX}"'"/s' scripts/setlocalversion 2>/dev/null || true
          sed -i "\$s|echo \"\$res\"|echo \"${SUFFIX}\"|" scripts/setlocalversion 2>/dev/null || true

          DEFCONFIG_PATH="arch/arm64/configs/gki_defconfig"
          if grep -q '^CONFIG_LOCALVERSION=' "$DEFCONFIG_PATH"; then
            sed -i '/^CONFIG_LOCALVERSION=/ s/=.*/=""/' "$DEFCONFIG_PATH"
          else
            echo 'CONFIG_LOCALVERSION=""' >> "$DEFCONFIG_PATH"
          fi
          sed -i '/^CONFIG_LOCALVERSION_AUTO=/d' "$DEFCONFIG_PATH"
          echo '# CONFIG_LOCALVERSION_AUTO is not set' >> "$DEFCONFIG_PATH"

          echo "KERNEL_RELEASE=${KERNEL_RELEASE_BASE}${SUFFIX}" >> "$GITHUB_ENV"

      - name: 编译内核
        shell: bash
        run: |
          set -euo pipefail
          COMMON_ROOT="$SOURCE_COMMON_ROOT"
          cd "$COMMON_ROOT"

          export PATH="/usr/lib/ccache:$CLANG_BIN:$PATH"
          export KBUILD_BUILD_USER="abk"
          export KBUILD_BUILD_HOST="abk"
          export KBUILD_BUILD_VERSION=1

          MAKE_ARGS=(
            -j"$(nproc --all)"
            LLVM=1 LLVM_IAS=1 ARCH=arm64
            CROSS_COMPILE=aarch64-linux-gnu-
            CC="ccache clang"
            LD=ld.lld HOSTLD=ld.lld
            O=out gki_defconfig all
          )
          case "$KERNEL_VERSION" in
            6.1|6.6)
              make "${MAKE_ARGS[@]}" KCFLAGS+=-O2
              ;;
            *)
              make "${MAKE_ARGS[@]}"
              ;;
          esac
          ccache -s

      - name: 打包 AnyKernel3
        shell: bash
        run: |
          set -euo pipefail
          WORKSPACE="$SOURCE_WORKSPACE"
          COMMON_ROOT="$SOURCE_COMMON_ROOT"
          cd "$WORKSPACE"
          git clone https://github.com/Xiaomichael/AnyKernel3 --depth=1
          rm -rf AnyKernel3/.git

          IMAGE_PATH="$(find "$COMMON_ROOT/out" -name Image | head -n 1)"
          if [ -z "$IMAGE_PATH" ]; then
            echo "::error::编译完成后未找到 Image"
            exit 1
          fi
          cp "$IMAGE_PATH" AnyKernel3/Image
          cp "$IMAGE_PATH" Image

          if [ "$EFFECTIVE_KPM" = "true" ]; then
            mkdir -p kpm_patch_temp
            cd kpm_patch_temp
            curl -LO https://github.com/SukiSU-Ultra/SukiSU_KernelPatch_patch/releases/download/0.13.0/patch_linux
            chmod +x patch_linux
            cp "$WORKSPACE/AnyKernel3/Image" ./Image
            ./patch_linux
            mv oImage "$WORKSPACE/AnyKernel3/Image"
            cd "$WORKSPACE"
            rm -rf kpm_patch_temp
          fi

          repo_slug="$(basename "$KERNEL_REPO")"
          repo_slug="${repo_slug%.git}"
          repo_slug="$(printf '%s' "$repo_slug" | sed 's#^android_kernel_##; s#[^A-Za-z0-9._-]#_#g')"
          release_label="${KERNEL_RELEASE:-${KERNEL_RELEASE_BASE}}"
          release_label="$(printf '%s' "$release_label" | sed 's#[^A-Za-z0-9._-]#_#g')"

          case "$KSU_VARIANT" in
            None) variant_label="Kernel_Only" ;;
            SukiSU) variant_label="SukiSU_Ultra" ;;
            *) variant_label="$KSU_VARIANT" ;;
          esac

          artifact_name="${repo_slug}_${release_label}_${variant_label}_AnyKernel3"
          if [ "$EFFECTIVE_ENABLE_SUSFS" = "true" ]; then
            artifact_name="${artifact_name}_with-SUSFS"
          fi
          image_artifact_name="${repo_slug}_${release_label}_${variant_label}_raw-image-debug"

          cd AnyKernel3
          zip -q -r9 "../${artifact_name}.zip" ./*
          cd "$WORKSPACE"
          echo "SOURCE_ARTIFACT_NAME=$artifact_name" >> "$GITHUB_ENV"
          echo "SOURCE_IMAGE_ARTIFACT_NAME=$image_artifact_name" >> "$GITHUB_ENV"

      - name: 上传 AnyKernel3 产物
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.SOURCE_ARTIFACT_NAME }}
          path: |
            source_workspace/*.zip
            LICENSE
            THIRD_PARTY_NOTICES.md
          if-no-files-found: error

      - name: 上传内核 Image
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.SOURCE_IMAGE_ARTIFACT_NAME }}
          path: source_workspace/Image
          if-no-files-found: warn
